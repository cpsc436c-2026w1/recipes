[project]
name = "recipe-agent-agentcore"
version = "0.1.0"
description = "A Strands agent with caps and approval in hooks, tools behind an AgentCore Gateway, hosted on AgentCore Runtime (CPSC 436C recipe)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",                 # scripts/lake.py: CreateBucketConfiguration.Tags
    "httpx>=0.27",
    "logfire>=4",
    "mcp>=1.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Pinned: the hook and interrupt names in main/hooks.py are the ones of this release.
    "strands-agents[openai]==1.64.0",
    # ext-sdk-lambda: the second SDK, the read-only SQL engine and its parse check (pinned at the versions read)
    "pydantic-ai-slim[openai]==2.71.0",
    "duckdb==2.0.0",
    "sqlglot==30.31.0",
]

[dependency-groups]
dev = [
    "agent-client-protocol==0.12.1",  # inspect-ai 0.3.287 breaks with 1.0.0 (acp.helpers)
    "behave>=1.3.3",
    "inspect-ai==0.3.287",
    "moto[dynamodb,iam,awslambda,s3,ssm,logs]>=5.0",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
