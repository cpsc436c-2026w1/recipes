[project]
name = "recipe-lambda-dynamodb"
version = "0.1.0"
description = "CPSC 436C recipe: a small HTTPS API (Lambda function URL) in front of DynamoDB, with a least-privilege role"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",                # main/handler.py; the Lambda Python runtime already has it, so it is not zipped
    "pydantic>=2.9",              # src/rides/events.py: the event models the simulated data sets are checked against
    "duckdb>=1.1",                # ext-read-path: results.duckdb and summary.sql; ext-dashboard-page: bench.py
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # a local stand-in for AWS: inside the process for the handlers and scripts, as a server for the AWS CLI
    "moto[dynamodb,server,s3,athena,glue,iam,awslambda,logs,scheduler,sts]>=5.1",
    "behave>=1.3.3",
    "playwright==1.64.1",         # the @browser scenarios of ext-dashboard-page; skipped when Chromium is not installed
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rides"]          # the shared event models (simulated-runs), installed so sim/replay.py finds them

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "sim", "scripts", "."]
