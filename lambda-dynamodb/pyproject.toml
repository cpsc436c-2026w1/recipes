[project]
name = "recipe-lambda-dynamodb"
version = "0.1.0"
description = "CPSC 436C recipe: a small HTTPS API (Lambda function URL) in front of DynamoDB, with a least-privilege role"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",                # main/handler.py; the Lambda Python runtime already has it, so it is not zipped
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "moto[dynamodb,server]>=5.1", # a local stand-in for DynamoDB: inside the process for the handler tests, as a server for the AWS CLI
    "behave>=1.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.uv]
package = false
