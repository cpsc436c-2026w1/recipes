[project]
name = "concurrency-correctness"
version = "0.1.0"
description = "Two clients race on one DynamoDB item: a conditional write accepts one; a retried write applies once"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "moto[dynamodb]>=5.0",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["main", "ext-idempotent-retry", "."]
