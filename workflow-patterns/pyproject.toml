[project]
name = "recipe-workflow-patterns"
version = "0.1.0"
description = "Prompt chain, parallel calls and evaluator-optimizer, one short file each (CPSC 436C recipe)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["main"]
testpaths = ["tests"]
