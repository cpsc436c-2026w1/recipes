[project]
name = "recipe-dynamodb"
version = "0.1.0"
description = "CPSC 436C recipe: a DynamoDB store for a ride app's live trips, keyed by its access patterns, with conditional writes"
requires-python = ">=3.11"
dependencies = []                 # the scenarios are bash and the AWS CLI; Python runs only the offline tests

[dependency-groups]
dev = [
    "pytest>=8.3",
    "moto[server]>=5.1",          # a local stand-in for DynamoDB that the AWS CLI can talk to
    "behave>=1.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.uv]
package = false
