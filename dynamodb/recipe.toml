# Machine-readable summary of a recipe, for tools and coding assistants.
# Schema: _template/recipe.toml.
name = "dynamodb"
format = "main-scenario"
task = "A DynamoDB store for a ride app's live trips: keys from the app's reads, strong reads where needed, and a conditional write so that one of two racing drivers wins"
shapes = ["operational-first", "genai-first"]
extensions = ["concurrency-correctness"]
lectures = ["L12", "L13", "L17"]
core = ["DynamoDB", "S3", "Athena"]
secondary = []
region = "ca-central-1"
cost_one_run = "well under 0.01 USD per scenario (measured units in output/, AWS price list ca-central-1)"
summary = "AWS CLI scripts that build a DynamoDB trip store keyed by its access patterns, race two conditional writes, add a sort key and transactions, export the table to S3 for Athena, and search riders' messages with a vector index"

[[practices]]
name = "key design from access patterns: every frequent read names a key or an index; a read with neither is a Scan"
source = "L12; DynamoDB developer guide, access patterns (bp-general-nosql-design)"

[[practices]]
name = "conditional writes against lost updates; transactions only where items must agree; optimistic locking by version"
source = "L12-L13; DynamoDB developer guide, condition expressions and transactions"

[[practices]]
name = "reports read an export in the lake, not the live table"
source = "L12-L13; DynamoDB developer guide, export to S3"

[[practices]]
name = "location lookups by key: items stored under their map cell and type, a request reads its cell and its neighbours, the code computes the distances"
source = "L12; DynamoDB developer guide, access patterns (bp-general-nosql-design) and transactions (transaction-apis)"

[[practices]]
name = "vector search where the data already is: an index added to the table, filters applied during the search, the bill measured in bytes on a sample"
source = "L17; DynamoDB developer guide, vector search (VectorSearchWorkingWith, VectorSearchMonitoring)"

[instruments]
files = ["main/run.sh", "ext-riders-and-drivers/run.sh", "ext-nightly-report/run.sh", "ext-vector-search/run.sh", "ext-vector-search/vectors.py", "ext-vector-search/vectors.json", "ext-nearby/run.sh", "ext-nearby/nearby.py", "ext-nearby/clean_up.py", "ext-nearby/sim/generate.py", "ext-nearby/scripts/tags.py", "lib.sh", "clean_up.sh"]

[validates]
command = "uv run pytest -q"
shows = "every script's commands under DRY=1 (ext-vector-search only so: moto does not have SearchVectors); with the AWS CLI installed, the real scripts against moto: one of two accepts wins, a rider's history comes back in time order, a cancelled transaction changes neither item, a stale version is refused, clean-up leaves no tables"

[scenarios]
main = "main/run.sh"
ext-riders-and-drivers = "ext-riders-and-drivers/run.sh"
ext-nightly-report = "ext-nightly-report/run.sh"
ext-vector-search = "ext-vector-search/run.sh"
ext-nearby = "ext-nearby/run.sh"

[commands]
setup = "uv sync"
test = "uv run pytest -q"          # offline, no AWS account
scenarios = "uv run behave"        # offline: the scenarios of the README's Requirements
run = "bash main/run.sh"           # in the team sandbox; KEEP=1 keeps the tables for the extensions
dry_run = "DRY=1 bash main/run.sh"
clean = "bash clean_up.sh --yes"         # BUCKET=<bucket> as well after ext-nightly-report

[env]
PREFIX = "first part of every table name; default recipe"
AWS_REGION = "ca-central-1"
KEEP = "1 keeps what the scenario made"
DRY = "1 prints the commands and runs none"
BUCKET = "an S3 bucket in ca-central-1; ext-nightly-report only"
KB_MCP_TOKEN = "your course token; ext-vector-search makes its vectors through the course LLM gateway when it and COURSE_GATEWAY_URL are set"
WAIT_MINUTES = "how long ext-vector-search waits for its vector index, default 30"
TEAM = "ext-nearby: the Team tag of its tables, default $PREFIX"
OWNER = "ext-nearby: the Owner tag of its tables, default your login name"
PURPOSE = "ext-nearby: adds the tag purpose=<value> (the course's own runs set recipe)"
SPEED = "ext-nearby: how many times faster than real time the hour is replayed, default 5"
MAX_RINGS = "ext-nearby: the most rings a nearest-N request reads, default 3"
LEDGER = "ext-nearby: its ledger of created tables, default ext-nearby/state/ledger.jsonl"

[constraints]                       # what an assistant must keep when it changes this recipe
no_keys_in_code = true
name_prefix_env = "PREFIX"
every_racing_write_conditional = true    # do not drop a ConditionExpression to make a run pass
names_built_in = "lib.sh"                # a new table goes there and into clean_up.sh
