stub = { calls = [{ name = "get_comments", arguments = { zone = 48, start = "2026-11-23 09:00", end = "2026-11-23 10:00" } }], reply = "Not all: riders say the driver could not find the entrance or double parked.", cited_ids = ["c-0002", "c-0008"] }

[[attack]]
