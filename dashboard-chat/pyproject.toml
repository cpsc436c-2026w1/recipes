[project]
name = "recipe-dashboard-chat"
version = "0.1.0"
description = "Chat on the dashboard: plain-language questions answered by read-only SQL over DuckDB (CPSC 436C recipe)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "duckdb>=1.1",
    "httpx>=0.27",
    "sqlglot>=25",
]

[dependency-groups]
app = [
    "chatlas>=0.23",
    "pandas>=2",
    "querychat>=0.9",
    "shiny>=1.8",
]
dev = [
    "behave>=1.3.3",
    "moto[cloudwatch,dynamodb,sns]>=5.0",
    "playwright==1.64.1",
    "pytest>=8",
]

[tool.uv]
package = false
# `uv sync` installs both groups: dev (tests) and app (the Shiny app of ext-shiny-app/). The container image
# of the app is built with --no-dev.
default-groups = ["dev", "app"]

[tool.pytest.ini_options]
pythonpath = [".", "ext-answer-cache", "ext-guardrails-redteam", "ext-trace-alarms", "ext-feedback", "ext-shiny-app"]
testpaths = ["tests"]
