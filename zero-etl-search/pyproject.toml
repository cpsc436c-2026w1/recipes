[project]
name = "recipe-zero-etl-search"
version = "0.1.0"
description = "DynamoDB as the source of truth, an OpenSearch Serverless index kept in step by a Lambda function on the table's stream (CPSC 436C recipe)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27",
    "marimo>=0.9",
    "opensearch-py>=2.6",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "moto[dynamodb,s3,sqs,opensearchserverless,osis]>=5.0",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "ext-embeddings", "ext-zero-etl"]
testpaths = ["tests"]
