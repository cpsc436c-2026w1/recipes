[project]
name = "project-skeleton"
version = "0.1.0"
description = "CPSC 436C recipe: the first slice in three project shapes"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "duckdb>=1.1",
    "pyarrow>=17",
    "openai>=1.50",
    "moto[s3,dynamodb,kinesis,firehose,glue,athena,iam,awslambda,logs]>=5.0",   # offline runs and tests
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skeleton"]

[tool.pytest.ini_options]
testpaths = ["tests"]
