[project]
name = "recipe-cdc-to-lake"
version = "0.1.0"
description = "DynamoDB change stream into an Iceberg table in S3, queried by Athena, with freshness measured (CPSC 436C recipe)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",
    "duckdb>=1.4",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pyiceberg[sql-sqlite,pyarrow,glue,pyiceberg-core]>=0.10",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "moto[dynamodb,s3,firehose,cloudwatch,athena,glue,iam,awslambda,logs,scheduler,sns,sts]>=5.1",
    "pytest>=8",
]

# The shared event models are a package (src/rides), so `uv sync` installs them and every script imports
# `rides.events` the same way (simulated-runs' layout; the helpers are copies of its files).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rides"]

[tool.pytest.ini_options]
pythonpath = ["sim", "scripts", "."]
testpaths = ["tests"]
