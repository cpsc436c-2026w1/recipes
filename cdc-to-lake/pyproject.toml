[project]
name = "recipe-cdc-to-lake"
version = "0.1.0"
description = "DynamoDB change stream into an Iceberg table in S3, queried by Athena, with freshness measured (CPSC 436C recipe)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pyiceberg[sql-sqlite,pyarrow,glue,pyiceberg-core]>=0.10",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "moto[dynamodb,s3,firehose,cloudwatch]>=5.0",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
