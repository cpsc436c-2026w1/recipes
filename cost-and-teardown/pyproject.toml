[project]
name = "cost-and-teardown"
version = "0.1.0"
description = "CPSC 436C recipe: the course tags and a creation ledger on every create, one inventory found by every route, the cost of a run, of 30 days and of a year from measured units, and a teardown that proves nothing is left"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",
    "pydantic>=2.9",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "moto[s3,dynamodb,kinesis,athena,glue,iam,awslambda,logs,sqs,sts,resourcegroupstaggingapi,scheduler,appsync,cloudwatch]>=5.1",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rides"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["sim", "scripts", "."]
