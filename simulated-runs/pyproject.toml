[project]
name = "simulated-runs"
version = "0.1.0"
description = "CPSC 436C recipe: simulated data sets whose answer is known, one replayer for every target, whole-run checks offline and on AWS, and a daily check of the deployed system"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",
    "pydantic>=2.9",
    "duckdb>=1.1",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "moto[s3,dynamodb,kinesis,sqs,sns,athena,glue,iam,awslambda,logs,cloudwatch,scheduler,sts]>=5.1",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rides"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["sim", "scripts", "."]
