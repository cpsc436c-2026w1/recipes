[project]
name = "s3-event-etl"
version = "0.1.0"
description = "CPSC 436C recipe: each file checked as it lands in S3, bad rows set aside with the reason, good rows loaded once into an Iceberg table by a Glue job or one Athena MERGE, with limits on the runs"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",
    "pydantic>=2.9",
    "tzdata>=2025.2",
    "duckdb>=1.1",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "moto[s3,dynamodb,athena,glue,iam,awslambda,logs,sns,sts,scheduler]>=5.1",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rides"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["sim", "scripts", "pipeline", "."]
