[project]
name = "recipe-llm-state-dynamodb"
version = "0.1.0"
description = "Chat history, answer cache and traces for an LLM app, kept in DynamoDB (CPSC 436C recipe)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "moto[dynamodb]>=5.0",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["main", "ext-answer-cache", "ext-traces", "."]
testpaths = ["tests"]
