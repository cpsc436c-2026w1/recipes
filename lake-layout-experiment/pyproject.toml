[project]
name = "recipe-lake-layout-experiment"
version = "0.1.0"
description = "Which table layout and which engine answer the zone counts: four layouts, three sizes, Athena and DuckDB in Lambda (CPSC 436C recipe)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",
    "duckdb>=1.1",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "moto[athena,glue,iam,lambda,logs,s3]>=5.1",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "scripts", "duckdb_fn"]
testpaths = ["tests"]
