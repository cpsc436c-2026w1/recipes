[project]
name = "prompt-optimization"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dspy==3.5.0",
    "duckdb>=2.0.0",
    "gepa==0.1.4",
    "numpy>=2.3.4",
    "pyyaml>=6.0.3",
    "scipy>=1.16.3",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
