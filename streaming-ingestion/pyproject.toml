[project]
name = "streaming-ingestion"
version = "0.1.0"
description = "Live updates through Kinesis Data Streams into DynamoDB with their lag measured; windowed counts and fan-out as extensions"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "moto[dynamodb,sns,sqs,awslambda,iam]>=5.0",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["main", "ext-windowed-aggregates", "ext-fan-out", "."]
