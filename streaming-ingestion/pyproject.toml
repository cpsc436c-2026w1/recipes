[project]
name = "streaming-ingestion"
version = "0.1.0"
description = "Live updates through Kinesis Data Streams into DynamoDB with their lag measured; windowed counts, fan-out, a source poller and queue ingestion as extensions"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "moto[dynamodb,sns,sqs,s3,awslambda,iam,scheduler]>=5.1",
    "pytest>=8.3",
]

# The shared event models are the package `rides` under src/ (sim/replay.py imports rides.events), so uv sync
# installs it; the scripts are run by path, as before.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rides"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["main", "ext-windowed-aggregates", "ext-fan-out", "ext-queue-ingest", "ext-source-poller", "sim",
              "scripts", "src", "."]
