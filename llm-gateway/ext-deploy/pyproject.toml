[project]
name = "gateway"
version = "0.1.0"
description = "Model gateway in front of any OpenAI-compatible endpoint: a key per caller, a budget per key, alerts"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.123",
    "httpx>=0.28.1",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
gw-admin = "gateway.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "moto[dynamodb,secretsmanager,sns]>=5.2.5",
    "pytest>=9.2.0",
]
