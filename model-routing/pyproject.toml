[project]
name = "recipe-model-routing"
version = "0.1.0"
description = "Model routing: a small model labels each request, app code runs a fixed path per label (CPSC 436C recipe)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "ext-eval"]
testpaths = ["tests"]
